<section class="journey" id="j1">
  <div class="jhead"><span class="jnum">JOURNEY 1</span><h2>First run</h2></div>
  <p class="goal"><em>"I want this character to remember things about me."</em>
  Switch it on and reach visible proof it worked, without needing to know what a draft is.</p>

  <div class="flow">
    <span class="step"><b>Enable</b> in chat settings</span>
    <span class="step"><b>See</b> what it can learn from now</span>
    <span class="step"><b>Accept</b> a handful, modes stated</span>
    <span class="step"><b>Observe</b> it used in a reply</span>
  </div>

  <div class="frames">

    <figure class="frame">
      <figcaption><span class="n">1.1</span><span class="t">Enable, with an immediate next step</span></figcaption>
      <div class="screen">
        <div class="bar"><span class="chip on">on</span> Long-Term Memory</div>
        <div class="box">
          <div class="row"><span class="grow"><b>Ready to learn from</b></span></div>
          <div class="sp"></div>
          <div class="list">
            <div class="item"><span class="grow">Character card <span class="faint">· 1 source</span></span><span class="btn">Import</span></div>
            <div class="item"><span class="grow">Chat summaries <span class="faint">· none yet</span></span><span class="chip">later</span></div>
          </div>
        </div>
        <div class="box solid mono">Nothing is stored until you accept it.</div>
      </div>
      <div class="note"><span class="fx">F2</span><span class="fx">F3</span>
      Counts are shown for <b>every</b> source, including the empty one, with when it fills.
      The current build opens on chat summaries, which is necessarily empty on a new chat, and
      says nothing about the tab that does have something.</div>
    </figure>

    <figure class="frame">
      <figcaption><span class="n">1.2</span><span class="t">What it proposes, in plain nouns</span></figcaption>
      <div class="screen">
        <div class="bar">4 things learned from the character card</div>
        <div class="list">
          <div class="item"><span class="cb on"></span><span class="grow">Works nights at a clinic <span class="faint">· about Wren</span></span></div>
          <div class="item"><span class="cb on"></span><span class="grow">Afraid of open water <span class="faint">· about Wren</span></span></div>
          <div class="item"><span class="cb"></span><span class="grow">Lives in the harbour district <span class="faint">· about the world</span></span></div>
        </div>
        <div class="box">
          <div class="row"><span class="grow">Use these in</span>
            <span class="chip on">this chat</span><span class="chip">roleplay</span><span class="chip">game</span></div>
        </div>
        <div class="row"><span class="btn pri">Remember these</span><span class="btn">Not now</span></div>
      </div>
      <div class="note"><span class="fx">F1</span><span class="fx">F8</span><span class="fx">F9</span>
      No drafts, no mutations, no evidence units. Mode eligibility is stated here and
      defaulted from the originating chat, which is the single control that decides whether any
      of this is ever recallable. Today it is read-only text in review and only editable later
      in a different workspace, and an import defaults to roleplay regardless of where you are.</div>
    </figure>

    <figure class="frame">
      <figcaption><span class="n">1.3</span><span class="t">Proof, two turns later</span></figcaption>
      <div class="screen">
        <div class="bar"><span class="grow">Memory</span><span class="chip">this turn</span></div>
        <div class="box">
          <div class="row"><span class="grow"><b>2 memories used</b> · 112 tokens</span></div>
          <div class="sp"></div>
          <div class="ph l"></div><div class="ph m"></div>
          <div class="sp"></div>
          <div class="row faint mono">14:22 · turn 6</div>
        </div>
        <div class="box solid"><span class="dim">Nothing dropped this turn.</span></div>
      </div>
      <div class="note"><span class="fx">F7</span>
      A timestamp and a turn reference, so the number can be read as <b>this turn</b> rather than
      as the last time anything worked. The current readout has no negative state and no
      timestamp, so it holds a stale count indefinitely when injection is dead.</div>
    </figure>

  </div>
</section>
