<section class="journey" id="j4">
  <div class="jhead"><span class="jnum">JOURNEY 4</span><h2>Browse and correct</h2></div>
  <p class="goal"><em>"It said something about me that is wrong. Find it and fix it."</em>
  Locate one stored memory among hundreds, read where it came from, and change it in place.</p>

  <div class="flow">
    <span class="step"><b>Filter</b> the vault down</span>
    <span class="step"><b>Open</b> the memory</span>
    <span class="step"><b>Correct</b> the claim</span>
    <span class="step"><b>Resolve</b> a stored conflict</span>
  </div>

  <div class="frames">

    <figure class="frame">
      <figcaption><span class="n">4.1</span><span class="t">Vault browser, same facets as review</span></figcaption>
      <div class="screen">
        <div class="row">
          <div class="rail box">
            <div class="mono dim">type</div>
            <div class="ph l"></div><div class="ph m"></div>
            <div class="sp"></div>
            <div class="mono dim">subject · status</div>
            <div class="ph f"></div><div class="ph s"></div>
            <div class="sp"></div>
            <div class="mono dim">mode · cap pressure</div>
            <div class="ph m"></div><div class="ph l"></div>
          </div>
          <div class="col grow">
            <div class="input ph-text">search memories</div>
            <div class="bar">161 memories · 24 shown <span class="chip">source notes hidden</span></div>
            <div class="row"><span class="chip">group by subject</span><span class="chip on">sort by size</span></div>
            <div class="list">
              <div class="item"><span class="grow">Wren · identity <span class="faint">· 19.2k / 20k</span></span><span class="chip warn">near cap</span></div>
              <div class="item"><span class="grow">Wren · timeline <span class="faint">· 41 contributions</span></span><span class="chip">roleplay</span></div>
              <div class="item"><span class="grow">Harbour district · world <span class="faint">· 3.1k / 20k</span></span></div>
            </div>
          </div>
        </div>
      </div>
      <div class="note"><span class="fx">F5</span><span class="fx">F55</span>
      One list with type, subject, status, mode eligibility and cap pressure as filters, and source
      notes excluded by default so the total matches what recall can actually reach. The current vault
      offers a status filter and free-text search, counts source notes in every total, and renders them
      first.</div>
    </figure>

    <figure class="frame">
      <figcaption><span class="n">4.2</span><span class="t">One memory, with provenance and use</span></figcaption>
      <div class="screen">
        <div class="bar"><span class="grow">Wren · identity</span><span class="chip">roleplay</span><span class="chip">chat</span></div>
        <div class="box">
          <div class="row"><span class="grow"><b>Works nights at a clinic</b></span><span class="faint mono">recalled 41×</span></div>
          <div class="sp"></div>
          <div class="row faint mono">from character card · imported 3 Mar</div>
        </div>
        <div class="box">
          <div class="row"><span class="grow">Afraid of open water</span><span class="faint mono">recalled 0×</span></div>
          <div class="row faint mono">from chat summary · turn 88</div>
        </div>
        <div class="box solid"><div class="row"><span class="grow">Section length</span><span class="mono">19,240 / 20,000</span></div>
          <div class="meter warn"><i class="w96"></i></div></div>
      </div>
      <div class="note"><span class="fx">F47</span><span class="fx">F58</span>
      Each stored line names the contribution that produced it and how many times it has been injected,
      both of which are already written to disk. Today the note editor is one free-form text area with
      no link back to the evidence unit and no recall count on any route, so a line that has never been
      used looks identical to one the model leans on every turn.</div>
    </figure>

    <figure class="frame">
      <figcaption><span class="n">4.3</span><span class="t">Correct it in place</span></figcaption>
      <div class="screen">
        <div class="bar">Editing one contribution</div>
        <div class="input area ph-text">Works nights at the harbour clinic.</div>
        <div class="input ph-text">keywords: clinic, nights, harbour</div>
        <div class="row"><span class="grow mono dim">412 / 20,000 characters</span><span class="chip">18 / 30 keywords</span></div>
        <div class="row"><span class="btn pri">Save</span><span class="btn">Stop using here</span><span class="btn">Forget</span></div>
        <div class="box solid mono">Note id derives from the subject name. Renaming the subject creates a second note.</div>
      </div>
      <div class="note"><span class="fx">F45</span><span class="fx">F57</span><span class="fx">F58</span>
      Per-contribution edit, scope removal and delete, backed by the existing note patch route, with a
      live counter against the character and keyword caps instead of a silent trim. The current editor
      cuts text at 20,000 characters with no counter and no marker, and correcting a wrong claim means
      fixing the corpus and re-ingesting the source.</div>
    </figure>

    <figure class="frame">
      <figcaption><span class="n">4.4</span><span class="t">A stored conflict, with a third option</span></figcaption>
      <div class="screen">
        <div class="bar"><span class="grow">Conflict on <span class="mono">identity</span></span><span class="chip bad">unresolved</span></div>
        <div class="box"><div class="row"><span class="grow"><b>Existing</b></span><span class="faint mono">recalled 41×</span></div>
          <div class="ph l"></div></div>
        <div class="box solid"><div class="row"><span class="grow"><b>Proposed</b></span><span class="faint mono">from turn 214</span></div>
          <div class="ph m"></div></div>
        <div class="row"><span class="btn">Keep existing</span><span class="btn">Take proposed</span><span class="btn pri">Keep both, in order</span></div>
        <div class="box solid mono">Merge two notes for one subject: blocked, keyword union is 34 of 30.</div>
      </div>
      <div class="note"><span class="fx">F35</span><span class="fx">F56</span>
      Existing and proposed sit side by side with the recall count on the text about to be overwritten,
      and keeping both ordered is offered because most contradictions in a long story are the situation
      moving rather than a dispute. Review never reads conflicts at all today, and the vault shows the
      proposed value without ever displaying the existing one.</div>
    </figure>

  </div>
</section>
